*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0f0f0f;color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px}
.container{max-width:600px;width:100%}
.progress-wrap{margin-bottom:30px;width:100%}
.progress-bar{height:6px;background:#333;border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#A259FF,#FF7AB6);transition:width .4s;border-radius:3px}
.progress-text{text-align:center;margin-top:8px;color:#888;font-size:14px}
.question-card{background:#1a1a1a;border-radius:20px;padding:30px;margin-bottom:24px;border:1px solid #333;animation:slideIn .4s}
@keyframes slideIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.question-number{color:#A259FF;font-size:14px;font-weight:600;margin-bottom:12px}
.question-text{font-size:20px;font-weight:600;line-height:1.5;margin-bottom:24px}
.option-list{display:flex;flex-direction:column;gap:12px}
.option{background:#252525;border:2px solid #333;border-radius:14px;padding:16px 20px;cursor:pointer;transition:all .2s;font-size:16px}
.option:hover{border-color:#444;background:#2a2a2a}
.option.selected{border-color:#A259FF;background:rgba(162,89,255,0.15)}
.back-question{margin-top:20px;text-align:center;color:#666;cursor:pointer;padding:12px;font-size:14px}
.back-question:hover{color:#A259FF}
.result-card{background:linear-gradient(135deg,#1a1a2e,#16213e);border-radius:20px;padding:40px 30px;text-align:center;animation:fadeIn .6s}
@keyframes fadeIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
.result-title{font-size:16px;color:#888;margin-bottom:12px}
.result-name{font-size:32px;font-weight:700;color:#A259FF;margin-bottom:16px}
.result-desc{font-size:16px;color:#aaa;line-height:1.6;margin-bottom:30px}
.match-list{display:flex;flex-direction:column;gap:12px;margin-bottom:30px}
.match-item{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.05);padding:12px 16px;border-radius:12px}
.match-bar{flex:1;height:8px;background:#333;border-radius:4px;overflow:hidden}
.match-fill{height:100%;background:linear-gradient(90deg,#A259FF,#FF7AB6);border-radius:4px}
.match-name{width:80px;text-align:left;font-weight:500}
.match-percent{width:40px;text-align:right;color:#A259FF;font-weight:600}
.share-btns{display:flex;gap:12px;justify-content:center}
.share-btn{padding:12px 24px;border-radius:25px;border:none;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s}
.share-btn.primary{background:#A259FF;color:#000}
.share-btn.secondary{background:#333;color:#fff}
.back-btn{position:fixed;top:20px;left:20px;background:#1a1a1a;border:1px solid #333;color:#fff;width:44px;height:44px;border-radius:50%;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center}

// Get 12 random questions
function getQ(id){
const b=QB[id]||QB['perfect-match'];
return [...b].sort(()=>Math.random()-.5).slice(0,12).map((x,i)=>({id:'q'+(i+1),t:x.t,o:x.o.map((t,s)=>({text:t,score:String.fromCharCode(65+s)}))}));
}
let questions=getQ(quizId);
let currentQ=0,answers={};

const results={
A:{n:'Type A',d:'You are a passionate and direct person.'},
B:{n:'Type B',d:'You are thoughtful and reserved.'},
C:{n:'Type C',d:'You are balanced and adaptive.'},
D:{n:'Type D',d:'You are spontaneous and fun-loving.'}
};

function rnd(min,max){return Math.floor(Math.random()*(max-min+1))+min}
function goHome(){window.location.href='index.html'}
function goQuiz(id){window.location.href='quiz.html?id='+id}

function rndP(){return rnd(45,65)}

function renQ(){
const q=questions[currentQ];
const p=((currentQ+1)/questions.length)*100;
const ca=answers[q.id]||'';
document.getElementById('app').innerHTML=`
<div class="progress-wrap"><div class="progress-bar"><div class="progress-fill" style="width:${p}%"></div></div><div class="progress-text">${currentQ+1}/${questions.length}</div></div>
<div class="question-card"><div class="question-number">Question ${currentQ+1}</div><div class="question-text">${q.t}</div><div class="option-list">${q.o.map(o=>`<div class="option ${ca===o.score?'selected':''}" onclick="sel('${o.score}')">${o.text}</div>`).join('')}</div>${currentQ>0?`<div class="back-question" onclick="prev()">← Previous</div>`:''}</div>`;
}

function sel(s){
answers[questions[currentQ].id]=s;
if(currentQ<questions.length-1){currentQ++;renQ();}else{showR();}
}
function prev(){if(currentQ>0){currentQ--;renQ();}}

function showR(){
const sc={};
Object.values(answers).forEach(s=>sc[s]=(sc[s]||0)+1);
let top='A',mx=0;Object.entries(sc).forEach(([k,v])=>{if(v>mx){mx=v;top=k;}});
const m=[
{n:results[top].n,p:rndP()},
{n:results['B'].n,p:rndP()},
{n:results['C'].n,p:rndP()},
{n:results['D'].n,p:100-m[0].p-m[1].p-m[2].p}
].sort((a,b)=>b.p-a.p);

document.getElementById('app').innerHTML=`
<div class="result-card"><div class="result-title">Your result</div><div class="result-name">${m[0].n}</div><div class="result-desc">${results[top].d}</div>
<div class="match-list">${m.map(x=>`<div class="match-item"><div class="match-name">${x.n}</div><div class="match-bar"><div class="match-fill" style="width:${x.p}%"></div></div><div class="match-percent">${x.p}%</div></div>`).join('')}</div>
<div class="share-btns"><button class="share-btn primary" onclick="shareR()">📤 Share</button><button class="share-btn secondary" onclick="goQuiz('${quizId}')">🔄 Try Again</button></div></div>`;
}

function shareR(){
const t='I got '+document.querySelector('.result-name').textContent+'! Take quiz: '+window.location.href;
navigator.share?navigator.share({title:'My Result',text:t}):navigator.clipboard.writeText(t)&&alert('Link copied!');
}
