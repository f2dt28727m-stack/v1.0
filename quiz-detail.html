<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz - Quizmeup</title>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9900304220798571" crossorigin="anonymous"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0a0a0a;color:#fff;min-height:100vh;overflow-x:hidden}
.header{position:fixed;top:0;left:0;right:0;height:60px;background:rgba(10,10,10,0.95);backdrop-filter:blur(10px);display:flex;align-items:center;padding:0 20px;border-bottom:1px solid #222;z-index:100}
.back-btn{font-size:20px;cursor:pointer;color:#fff}
.logo{margin-left:15px;font-size:20px;font-weight:800;background:linear-gradient(90deg,#00d4ff,#00ff88);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.main{padding:80px 20px 40px;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.quiz-icon{width:140px;height:120px;background:linear-gradient(135deg,#1a1a2e,#16213e);border-radius:24px;display:flex;align-items:center;justify-content:center;font-size:36px;margin-bottom:30px;border:1px solid #333;gap:8px}
.quiz-title{font-size:24px;font-weight:700;margin-bottom:12px;line-height:1.3;padding:0 20px}
.quiz-meta{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:12px;margin-bottom:20px;color:#666;font-size:14px;padding:0 10px}
.stats{display:flex;gap:30px;margin-bottom:40px}
.stat-item{text-align:center}
.stat-num{font-size:20px;font-weight:700;color:#00d4ff}
.stat-label{font-size:12px;color:#666;margin-top:4px}
.actions{display:flex;flex-direction:column;gap:15px;width:100%;max-width:300px}
.start-btn{width:100%;padding:18px;background:linear-gradient(90deg,#00d4ff,#00ff88);border:none;border-radius:30px;font-size:18px;font-weight:700;color:#000;cursor:pointer}
.vote-btns{display:flex;justify-content:center;gap:40px}
.vote-btn{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:none;cursor:pointer;color:#666;font-size:14px}
.vote-btn .icon{width:50px;height:50px;background:#1a1a1a;border:1px solid #333;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px}
.description{max-width:400px;margin-top:40px;padding:20px;background:#141414;border-radius:16px;color:#888;font-size:14px;line-height:1.6}



/* Responsive adjustments for small screens */
@media (max-width: 480px) {
    .main {
        padding: 70px 15px 30px;
    }
    
    .quiz-icon {
        width: 100px;
        height: 100px;
        font-size: 40px;
        margin-bottom: 20px;
    }
    
    .quiz-title {
        font-size: 20px;
        padding: 0 10px;
        line-height: 1.3;
    }
    
    .quiz-meta {
        gap: 8px;
        margin-bottom: 15px;
        padding: 0 8px;
        flex-wrap: wrap;
    }
    
    .quiz-meta span {
        padding: 4px 10px !important;
        font-size: 10px !important;
        border-radius: 15px !important;
        white-space: nowrap;
    }
    
    .stats {
        gap: 20px;
        margin-bottom: 30px;
    }
    
    .stat-num {
        font-size: 18px;
    }
    
    .stat-label {
        font-size: 10px;
    }
    
    .actions {
        max-width: 250px;
    }
    
    .start-btn {
        padding: 16px;
        font-size: 16px;
        border-radius: 25px;
    }
    
    .description {
        max-width: 300px;
        margin-top: 30px;
        padding: 16px;
        font-size: 13px;
        line-height: 1.5;
    }
    
    .header {
        padding: 0 15px;
    }
    
    .logo {
        font-size: 18px;
    }
}

/* Specific adjustments for iPhone SE (320px) */
@media (max-width: 320px) {
    .main {
        padding: 65px 10px 25px;
    }
    
    .quiz-icon {
        width: 80px;
        height: 80px;
        font-size: 32px;
        margin-bottom: 15px;
        border-radius: 20px;
    }
    
    .quiz-title {
        font-size: 18px;
        padding: 0 8px;
        margin-bottom: 10px;
    }
    
    .quiz-meta {
        gap: 6px;
        margin-bottom: 12px;
        padding: 0 8px;
    }
    
    .quiz-meta span {
        padding: 3px 8px !important;
        font-size: 9px !important;
        border-radius: 12px !important;
    }
    
    .stats {
        gap: 15px;
        margin-bottom: 25px;
    }
    
    .stat-num {
        font-size: 16px;
    }
    
    .stat-label {
        font-size: 9px;
    }
    
    .actions {
        max-width: 220px;
    }
    
    .start-btn {
        padding: 14px;
        font-size: 15px;
    }
    
    .description {
        max-width: 280px;
        margin-top: 25px;
        padding: 14px;
        font-size: 12px;
    }
    
    .vote-btns {
        gap: 30px;
    }
    
    .vote-btn .icon {
        width: 40px;
        height: 40px;
        font-size: 18px;
    }
    
    .vote-btn {
        font-size: 12px;
    }
}

/* Adjustments for large screens */
@media (min-width: 768px) {
    .main {
        max-width: 768px;
        margin: 0 auto;
    }
    
    .quiz-meta {
        max-width: 600px;
        margin: 0 auto 20px;
    }
    
    .stats {
        gap: 40px;
    }
}

/* Ad container */
.ad-container {
    margin: 20px 0;
    display: flex;
    justify-content: center;
}

.ad-container ins {
    max-width: 100%;
}

/* Footer */
.footer {
    background: #0a0a0a;
    padding: 20px 0;
    margin-top: 40px;
    border-top: 1px solid #222;
}
.footer-content {
    text-align: center;
    font-size: 12px;
    color: #666;
    padding: 0 20px;
}
</style>
</head>
<body>
<div class="header"><div class="back-btn" onclick="goHome()">←</div><div class="logo" onclick="goHome()">Quizmeup</div></div>
<div class="main" id="app"></div>
<div class="ad-container">
    <ins class="adsbygoogle"
         style="display:block"
         data-ad-client="ca-pub-9900304220798571"
         data-ad-slot="2468135790"
         data-ad-format="auto"
         data-full-width-responsive="true"></ins>
</div>

<script>
if (window.adsbygoogle) {
    (adsbygoogle = window.adsbygoogle || []).push({});
}
</script>

<script>
// Get quiz ID from URL parameter
function getQuizId() {
    const urlParams = new URLSearchParams(window.location.search);
    return urlParams.get('id') || 'onequiz';
}

// Load quiz data from backend API
let quizData = null;

async function loadQuizData() {
    try {
        const quizId = getQuizId();
        console.log('Loading quiz:', quizId);
        const response = await fetch(`/api/quizzes/${quizId}`);
        console.log('Response status:', response.status);
        if (!response.ok) {
            throw new Error('Failed to load quiz data');
        }
        quizData = await response.json();
        console.log('Quiz data received:', quizData);
        renderQuizDetail();
    } catch (error) {
        console.error('Error loading quiz data:', error);
        // Fallback to default quiz data if loading fails
        const quizId = getQuizId();
        console.log('Using fallback for:', quizId);
        let fallbackData = {
            title: 'Which Disney Princess Resonates With Your Personality?',
            category: 'MBTI Personality',
            tags: ['Disney', 'Princess', 'Personality', 'MBTI'],
            description: 'Discover which Disney Princess matches your personality based on MBTI traits! Answer 12 questions to find your royal counterpart.'
        };
        
        if (quizId === 'quiz_harry_potter1') {
            fallbackData = {
                title: 'Which Harry Potter Character Matches Your Personality?',
                category: 'Harry Potter',
                tags: ['Harry Potter', 'Wizarding World', 'MBTI', 'Personality'],
                description: 'Answer 36 magical questions to discover which Harry Potter character you are most like!'
            };
        }
        
        quizData = fallbackData;
        renderQuizDetail();
    }
}

function goHome(){window.location.href='index.html';}
function startQuiz(){window.location.href='quiz.html?id=' + getQuizId();}

function getQuizEmojis(title) {
    const t = (title || '').toLowerCase();
    if (t.includes('disney') || t.includes('princess')) return ['👸', '🏰', '💫'];
    if (t.includes('harry potter') || t.includes('hogwarts')) return ['⚡', '🧙', '🦉'];
    if (t.includes('marvel') || t.includes('superhero')) return ['🦸', '💥', '🛡️'];
    if (t.includes('star wars')) return ['🌌', '⚔️', '🪐'];
    if (t.includes('anime')) return ['🎌', '🔥', '💪'];
    if (t.includes('mbti') || t.includes('personality')) return ['🧠', '💭', '🔍'];
    if (t.includes('love') || t.includes('relationship')) return ['❤️', '💕', '💌'];
    if (t.includes('career') || t.includes('work')) return ['💼', '📈', '🎯'];
    if (t.includes('travel') || t.includes('adventure')) return ['✈️', '🗺️', '🧭'];
    if (t.includes('food') || t.includes('cooking')) return ['🍕', '🍳', '🍽️'];
    if (t.includes('music')) return ['🎵', '🎶', '🎸'];
    if (t.includes('zodiac') || t.includes('astrology')) return ['🌟', '🔮', '♈'];
    if (t.includes('taylor') || t.includes('swift')) return ['🎤', '💃', '⭐'];
    if (t.includes('sza') || t.includes('song')) return ['🎶', '💃', '🌙'];
    if (t.includes('chatgpt') || t.includes('ai')) return ['🤖', '💡', '🚀'];
    if (t.includes('mythological') || t.includes('dragon')) return ['🐉', '⚔️', '👑'];
    if (t.includes('magic') || t.includes('creature')) return ['✨', '🔮', '🦄'];
    if (t.includes('animal') || t.includes('spirit')) return ['🐺', '🌲', '🌙'];
    if (t.includes('historical') || t.includes('figure')) return ['👑', '📜', '🏛️'];
    return ['📝', '❓', '💭'];
}

function renderQuizDetail() {
    const tags = quizData.tags || ['Disney', 'Princess', 'Personality', 'MBTI'];
    const emojis = getQuizEmojis(quizData.title);
    const q = {
        t: quizData.title || 'Which Disney Princess Resonates With Your Personality?',
        i: emojis[0],
        v: 1200000, // Views
        l: 8500, // Likes
        ts: 980000, // Tests
        sh: 12000, // Shares
        d: quizData.description || 'Discover which Disney Princess matches your personality based on MBTI traits! Answer 12 questions to find your royal counterpart.'
    };

    document.getElementById('app').innerHTML=`
    <div class="quiz-icon">${emojis.join('')}</div>
    <div class="quiz-title">${q.t}</div>
    <div class="quiz-meta">
        ${tags.map(tag => `<span style="background: rgba(0,212,255,0.2); color: #00d4ff; padding: 6px 14px; border-radius: 18px; font-size: 12px;">#${tag}</span>`).join('')}
    </div>
    <div class="stats"><div class="stat-item"><div class="stat-num">${(q.l/1000).toFixed(1)}K</div><div class="stat-label">Likes</div></div><div class="stat-item"><div class="stat-num">${(q.ts/10000).toFixed(1)}W</div><div class="stat-label">Tests</div></div><div class="stat-item"><div class="stat-num">${(q.sh/1000).toFixed(1)}K</div><div class="stat-label">Shares</div></div></div>
    <div class="actions"><button class="start-btn" onclick="startQuiz()">Start Now ▶</button></div>
    <div class="description">${q.d}</div>
    `;
}

// Initialize
loadQuizData();
</script>

<!-- Footer -->
<footer class="footer">
    <div class="footer-content">
        © 2026 Quizmeup, All Rights Reserved
    </div>
</footer>
</body>
</html>
