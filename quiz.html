<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz - Quizy</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0f0f0f;color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px;overflow-x:hidden}
.container{max-width:600px;width:100%}
.progress-wrap{margin-bottom:30px;width:100%}
.progress-bar{height:6px;background:#333;border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#00d4ff,#00ff88);transition:width .4s;border-radius:3px}
.progress-text{text-align:center;margin-top:8px;color:#888;font-size:14px}
.question-card{background:#1a1a1a;border-radius:20px;padding:30px;margin-bottom:24px;border:1px solid #333;animation:slideIn .4s}
@keyframes slideIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.question-number{color:#00d4ff;font-size:14px;font-weight:600;margin-bottom:12px}
.question-text{font-size:20px;font-weight:600;line-height:1.5;margin-bottom:24px}
.option-list{display:flex;flex-direction:column;gap:12px}
.option{background:#252525;border:2px solid #333;border-radius:14px;padding:16px 20px;cursor:pointer;transition:all .2s;font-size:16px}
.option:hover{border-color:#444;background:#2a2a2a}
.option.selected{border-color:#00d4ff;background:rgba(0,212,255,0.15)}
.back-question{margin-top:20px;text-align:center;color:#666;cursor:pointer;padding:12px;font-size:14px}
.back-question:hover{color:#00d4ff}
.result-card{background:linear-gradient(135deg,#1a1a2e,#16213e);border-radius:20px;padding:40px 30px;text-align:center;animation:fadeIn .6s}
@keyframes fadeIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
.result-title{font-size:16px;color:#888;margin-bottom:12px}
.result-name{font-size:32px;font-weight:700;color:#00d4ff;margin-bottom:16px}
.result-desc{font-size:16px;color:#aaa;line-height:1.6;margin-bottom:30px}
.match-list{display:flex;flex-direction:column;gap:12px;margin-bottom:30px}
.match-item{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.05);padding:12px 16px;border-radius:12px}
.match-bar{flex:1;height:8px;background:#333;border-radius:4px;overflow:hidden}
.match-fill{height:100%;background:linear-gradient(90deg,#00d4ff,#00ff88);border-radius:4px}
.m-name{width:80px;text-align:left;font-weight:500}
.m-pct{width:40px;text-align:right;color:#00d4ff;font-weight:600}
.share-btns{display:flex;gap:12px;justify-content:center;margin-top:20px}
.vote-btns{display:flex;justify-content:center;gap:40px;margin-top:20px}
.vote-btn{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:none;cursor:pointer;color:#666;font-size:14px}
.vote-btn .icon{width:44px;height:44px;background:#1a1a1a;border:1px solid #333;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px}
.vote-btn.liked .icon{border-color:#ff4757;color:#ff4757}
.vote-btn.disliked .icon{border-color:#7bed9f;color:#7bed9f}
.share-btn{padding:12px 24px;border-radius:25px;border:none;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s}
.share-btn.primary{background:#00d4ff;color:#000}
.share-btn.secondary{background:#333;color:#fff}
.back-btn{position:fixed;top:20px;left:20px;background:#1a1a1a;border:1px solid #333;color:#fff;width:44px;height:44px;border-radius:50%;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.loading{display:flex;align-items:center;justify-content:center;height:50vh;font-size:18px;color:#00d4ff}


/* Responsive adjustments for small screens */
@media (max-width: 480px) {
    body {
        padding: 15px;
    }
    
    .container {
        padding: 0 10px;
        max-width: 100%;
    }
    
    .question-card {
        padding: 20px 16px;
        border-radius: 16px;
    }
    
    .question-text {
        font-size: 18px;
        line-height: 1.4;
    }
    
    .option {
        padding: 14px 16px;
        font-size: 15px;
        border-radius: 12px;
    }
    
    .result-card {
        padding: 30px 20px;
        margin: 0 10px;
        border-radius: 16px;
    }
    
    .result-name {
        font-size: 24px;
        line-height: 1.2;
    }
    
    .result-name span {
        font-size: 14px !important;
    }
    
    .result-desc {
        font-size: 14px;
        line-height: 1.5;
    }
    
    .match-item {
        padding: 10px 12px;
    }
    
    .m-name {
        width: 70px;
        font-size: 13px;
    }
    
    .share-btns {
        flex-direction: column;
        align-items: center;
        gap: 8px;
    }
    
    .share-btn {
        width: 200px;
        padding: 10px 20px;
        font-size: 13px;
        border-radius: 20px;
    }
    

    
    .back-btn {
        top: 15px;
        left: 15px;
        width: 40px;
        height: 40px;
    }
}

/* Specific adjustments for iPhone SE (320px) */
@media (max-width: 320px) {
    body {
        padding: 10px;
    }
    
    .container {
        padding: 0 8px;
    }
    
    .question-card {
        padding: 16px 12px;
        margin-bottom: 20px;
    }
    
    .question-text {
        font-size: 16px;
        margin-bottom: 20px;
    }
    
    .option {
        padding: 12px 14px;
        font-size: 14px;
    }
    
    .result-card {
        padding: 25px 16px;
        margin: 0 8px;
    }
    
    .result-name {
        font-size: 20px;
    }
    
    .result-name span {
        font-size: 12px !important;
    }
    
    .result-desc {
        font-size: 13px;
        line-height: 1.4;
        margin-bottom: 20px;
    }
    
    .match-item {
        padding: 8px 10px;
    }
    
    .m-name {
        width: 60px;
        font-size: 12px;
    }
    
    .m-pct {
        font-size: 12px;
    }
    
    .share-btn {
        width: 180px;
        padding: 9px 18px;
        font-size: 12px;
    }
    
    .progress-text {
        font-size: 12px;
    }
    
    .question-number {
        font-size: 12px;
    }
}

/* Adjustments for medium screens */
@media (min-width: 481px) and (max-width: 768px) {
    .result-card {
        max-width: 500px;
        margin: 0 auto;
    }
    
    .result-name {
        font-size: 28px;
    }
    
    .result-name span {
        font-size: 16px !important;
    }
}

/* Adjustments for large screens */
@media (min-width: 769px) {
    .result-card {
        max-width: 600px;
        margin: 0 auto;
    }
}

/* Ad container */
.ad-container {
    margin: 30px auto;
    max-width: 600px;
    display: flex;
    justify-content: center;
}

.ad-container ins {
    max-width: 100%;
}

/* Footer */
.footer {
    background: #0f0f0f;
    padding: 20px 0;
    margin-top: 40px;
    border-top: 1px solid #333;
    width: 100%;
}
.footer-content {
    text-align: center;
    font-size: 12px;
    color: #666;
    padding: 0 20px;
}
</style>
</head>
<body>
<button class="back-btn" onclick="goBack()">←</button>
<div class="container" id="app"></div>

<script>
// Get quiz ID from URL parameter
function getQuizId() {
    const urlParams = new URLSearchParams(window.location.search);
    return urlParams.get('id') || 'onequiz';
}

// API Configuration
const API_CONFIG = {
    baseUrl: '/api',
    apiKey: 'quiz_app_secret_key_2026' // In a real app, this would be more secure
};

// Common config
let commonConfig = null;

// Load common config
async function loadCommonConfig() {
    try {
        const response = await fetch('config.json');
        if (response.ok) {
            commonConfig = await response.json();
        }
    } catch (error) {
        console.error('Error loading common config:', error);
    }
}

// Initialize common config
loadCommonConfig();

// App state
let quizData = null;
let questions = [];
let currentQ = 0;
let answers = {};
let resultsData = {};
let sessionToken = '';

// Simple encryption/decryption for data (simplified for demo)
function encrypt(data) {
    return btoa(JSON.stringify(data));
}

function decrypt(encryptedData) {
    return JSON.parse(atob(encryptedData));
}

// Helper function with timeout for fetch
async function fetchWithTimeout(url, options, timeout = 10000) {
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), timeout);
    
    try {
        const response = await fetch(url, {
            ...options,
            signal: controller.signal
        });
        clearTimeout(timeoutId);
        return response;
    } catch (error) {
        clearTimeout(timeoutId);
        throw error;
    }
}

// Get session token
async function getToken() {
    try {
        const response = await fetchWithTimeout(`${API_CONFIG.baseUrl}/token`);
        if (!response.ok) {
            throw new Error('Failed to get token');
        }
        const data = await response.json();
        sessionToken = data.token;
        return sessionToken;
    } catch (error) {
        console.error('Error getting token:', error);
        throw error;
    }
}

// Load quiz data from API
async function loadQuizData() {
    try {
        document.getElementById('app').innerHTML = '<div class="loading">Loading questions...</div>';
        
        // Get token
        const tokenRes = await fetch('/api/token');
        const tokenData = await tokenRes.json();
        const token = tokenData.token;
        
        // Load questions from API
        const quizId = getQuizId();
        const response = await fetch('/api/questions', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token: token, quiz_id: quizId })
        });
        
        if (!response.ok) {
            throw new Error('Failed to load quiz data');
        }
        
        const data = await response.json();
        
        // Format questions for the quiz
        questions = data.questions.map((q, i) => ({
            id: q.temp_id || `q${i+1}`,
            t: q.text,
            o: q.options.map((opt, s) => ({
                text: opt.text,
                score: opt.score || 'A',
                index: s
            }))
        }));
        
        quizData = { title: data.title, quizId: data.quiz_id, token: token };
        
    } catch (error) {
        console.error('Error loading quiz data:', error);
        document.getElementById('app').innerHTML = '<div class="loading">Failed to load questions. Please try again.</div>';
        throw error;
    }
}

// Submit answers and get result
async function submitAnswers() {
    try {
        document.getElementById('app').innerHTML = '<div class="loading">Calculating your result...</div>';
        
        // Prepare answers
        const formattedAnswers = {};
        Object.entries(answers).forEach(([qId, optionScore]) => {
            const question = questions.find(q => q.id === qId);
            if (question) {
                const optionIdx = question.o.findIndex(o => o.score === optionScore);
                if (optionIdx >= 0) {
                    formattedAnswers[qId] = optionIdx;
                }
            }
        });
        
        // Submit to API
        const response = await fetch('/api/result', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                token: quizData.token,
                quiz_id: quizData.quizId,
                answers: formattedAnswers
            })
        });
        
        if (!response.ok) {
            throw new Error('Failed to get result');
        }
        
        return await response.json();
        
    } catch (error) {
        console.error('Error submitting answers:', error);
        throw error;
    }
}

function rnd(min,max){return Math.floor(Math.random()*(max-min+1))+min}
function goHome(){window.location.href='index.html';}
function goBack(){window.location.href='quiz-detail.html?id=' + getQuizId();}

function renQ(){
const q=questions[currentQ];
const p=((currentQ+1)/questions.length)*100;
const ca=answers[q.id]||'';
document.getElementById('app').innerHTML=`
<div class="progress-wrap"><div class="progress-bar"><div class="progress-fill" style="width:${p}%"></div></div><div class="progress-text">${currentQ+1}/${questions.length}</div></div>
<div class="question-card"><div class="question-number">Question ${currentQ+1}</div><div class="question-text">${q.t}</div><div class="option-list">${q.o.map(o=>`<div class="option ${ca===o.score?'selected':''}" onclick="sel('${o.score}')">${o.text}</div>`).join('')}</div>${currentQ>0?`<div class="back-question" onclick="prev()">← Previous</div>`:''}</div>
<!-- AdSense Ad -->
<div class="ad-container">
    <ins class="adsbygoogle"
         style="display:block"
         data-ad-client="ca-pub-9900304220798571"
         data-ad-slot="1357924680"
         data-ad-format="auto"
         data-full-width-responsive="true"></ins>
</div>`;

// Initialize ads after rendering
if (window.adsbygoogle) {
    (adsbygoogle = window.adsbygoogle || []).push({});
}
}

function sel(s){
answers[questions[currentQ].id]=s;
if(currentQ<questions.length-1){currentQ++;renQ();}else{showR();}
}
function prev(){if(currentQ>0){currentQ--;renQ();}}

async function showR(){
    try {
        const resultData = await submitAnswers();
        const result = resultData.result;
        const percentages = resultData.percentages;
        
        // Extract character name from title (e.g., "The Enthusiastic Idealist (Pocahontas)" -> "Pocahontas (The Enthusiastic Idealist)")
        let characterName = "";
        let typeName = "";
        if (result.title.includes('(') && result.title.includes(')')) {
            const parts = result.title.split('(');
            const titlePart = parts[0].trim();
            const characterPart = parts[1].replace(')', '').trim();
            characterName = characterPart;
            typeName = titlePart;
        } else {
            characterName = result.title;
            typeName = "";
        }
        
        // Format percentages for display
        const displayPercentages = [
            { name: percentages.extrovert_introvert > 50 ? 'Extrovert' : 'Introvert', p: Math.abs(percentages.extrovert_introvert - 50) + 50 },
            { name: percentages.sensing_intuition > 50 ? 'Sensing' : 'Intuition', p: Math.abs(percentages.sensing_intuition - 50) + 50 },
            { name: percentages.thinking_feeling > 50 ? 'Thinking' : 'Feeling', p: Math.abs(percentages.thinking_feeling - 50) + 50 },
            { name: percentages.judging_perceiving > 50 ? 'Judging' : 'Perceiving', p: Math.abs(percentages.judging_perceiving - 50) + 50 }
        ];
        
        document.getElementById('app').innerHTML=`
        <div class="result-card"><div class="result-title">Your result is</div><div class="result-name">${characterName}<br><span style="font-size: 18px; opacity: 0.8;">(${typeName})</span></div><div class="result-desc">${result.description}</div>
        <div class="match-list">${displayPercentages.map(x=>`<div class="match-item"><div class="m-name">${x.name}</div><div class="match-bar"><div class="match-fill" style="width:${x.p}%"></div></div><div class="m-pct">${x.p}%</div></div>`).join('')}</div>
        <div class="share-btns"><button class="share-btn primary" onclick="shareR()">📤 Share</button><button class="share-btn secondary" onclick="goBack()">🔄 Try Again</button><button class="share-btn secondary" onclick="goRandom()">🎲 Random</button></div>
        </div>`;
    } catch (error) {
        console.error('Error showing result:', error);
        document.getElementById('app').innerHTML = '<div class="loading">Failed to calculate result. Please try again.</div>';
    }
}


function goRandom(){
// Reload the current quiz with a new set of random questions
window.location.href='quiz.html?id=' + getQuizId();
}
function shareR(){
const t='I got '+document.querySelector('.result-name').textContent+'! Take quiz: '+window.location.href;
navigator.share?navigator.share({title:'My Result',text:t}):navigator.clipboard.writeText(t)&&alert('Link copied!');
}

// Initialize
async function init() {
    try {
        await loadQuizData();
        renQ();
    } catch (error) {
        console.error('Initialization error:', error);
    }
}

init();
</script>

<!-- Footer -->
<footer class="footer">
    <div class="footer-content">
        © 2026 Quizy, All Rights Reserved
    </div>
</footer>
</body>
</html>
